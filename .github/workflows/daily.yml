name: daily

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    env:
      ENGLISH_DAILY_AUDIO_MODE: hotlink
      ENGLISH_DAILY_DATA_DIR: ./.ci-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Python compile check
        run: python -m compileall -q app ingest desktop tools run.py tests

      - name: Static checks
        run: |
          node --check static/app.js
          node --check static/sw.js
          for file in static/lib/*.js; do node --check "$file"; done

      - name: Ingest (hotlink audio, disposable database)
        run: python run.py ingest --state-dir state

      - name: Verify deterministic reconstruction
        run: python run.py reconstruct --json

      - name: Write stats to job summary
        run: python run.py stats --days 90 >> "$GITHUB_STEP_SUMMARY"

      - name: Export static site
        run: python run.py export-static --out site --public

      - name: Commit history and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site state
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily update $(date -u +%F)"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
