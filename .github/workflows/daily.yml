name: daily

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

environment:
  name: github-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest (hotlink audio, disposable database)
        env:
          ENGLISH_DAILY_AUDIO_MODE: hotlink
          ENGLISH_DAILY_DATA_DIR: ./.ci-data
        run: python run.py ingest --state-dir state

      - name: Export static site
        run: python run.py export-static --out site --public

      - name: Commit history and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site state
          if ! git diff --cached --quiet; then
            git commit -m "daily update $(date -u +%F)"
            git push
          else
            echo "No changes to commit."
          fi

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
