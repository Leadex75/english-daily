  - {text: interregno, aliases: [interregno, interregnos], level: C2, meaning: "el período entre dos reinados", meaning_fr: "interrègne", period: Edad Media, theme: Política, example: "El interregno duró varios meses.", tags: [política]}
  - {text: legitimismo, aliases: [legitimismo], level: C2, meaning: "el apoyo al derecho tradicional de una dinastía a gobernar", meaning_fr: "légitimisme", period: Siglo XIX, theme: Política, example: "El legitimismo se opuso al cambio.", tags: [política]}
  - {text: metarrelato, aliases: [metarrelato, metarrelatos], level: C2, meaning: "una narrativa global que explica el pasado", meaning_fr: "métarécit", period: Contemporáneo, theme: Cultura, example: "Rechazaron el metarrelato nacional.", tags: [cultura]}
  - {text: palimpsesto, aliases: [palimpsesto, palimpsestos], level: C2, meaning: "un manuscrito raspado y escrito de nuevo", meaning_fr: "palimpseste", period: General, theme: Cultura, example: "El palimpsesto escondía un texto antiguo.", tags: [cultura]}
  - {text: periodización, aliases: [periodización, periodizacion], level: C2, meaning: "la división de la historia en períodos nombrados", meaning_fr: "périodisation", period: General, theme: Ciencia, example: "La periodización marxista influyó en la escuela.", tags: [ciencia]}
  - {text: teleología, aliases: [teleología, teleologia], level: C2, meaning: "la explicación de los hechos por su finalidad", meaning_fr: "téléologie", period: General, theme: Cultura, example: "La teleología veía el imperio como un destino.", tags: [cultura]}
  - {text: epistemología, aliases: [epistemología, epistemologia], level: C2, meaning: "la rama de la filosofía que estudia el conocimiento", meaning_fr: "épistémologie", period: Contemporáneo, theme: Ciencia, example: "La epistemología histórica examina las fuentes.", tags: [ciencia]}
  - {text: hermenéutica, aliases: [hermenéutica, hermeneutica], level: C2, meaning: "el arte de interpretar textos", meaning_fr: "herméneutique", period: Contemporáneo, theme: Cultura, example: "La hermenéutica guió la lectura del archivo.", tags: [cultura]}
  - {text: diacronía, aliases: [diacronía, diacronia], level: C2, meaning: "el estudio de un fenómeno a lo largo del tiempo", meaning_fr: "diachronie", period: General, theme: Ciencia, example: "La diacronía mostró cambios en la lengua.", tags: [ciencia]}
  - {text: sincronía, aliases: [sincronía, sincronia], level: C2, meaning: "el estudio de un fenómeno en un momento dado", meaning_fr: "synchronie", period: General, theme: Ciencia, example: "La sincronía describía la lengua en 1900.", tags: [ciencia]}
  - {text: ontología, aliases: [ontología, ontologia], level: C2, meaning: "la rama de la filosofía que estudia la existencia", meaning_fr: "ontologie", period: Contemporáneo, theme: Cultura, example: "La ontología del pasado cambió con la modernidad.", tags: [cultura]}
