terms:
  - {text: casa, aliases: [casa, casas], level: A1, meaning: "un edificio donde vive la gente", meaning_fr: "maison", period: General, theme: Sociedad, example: "La familia volvió a casa tras la guerra.", tags: [hogar]}
  - {text: agua, aliases: [agua, aguas], level: A1, meaning: "un líquido claro que se bebe", meaning_fr: "eau", period: General, theme: Sociedad, example: "El agua del pozo era limpia.", tags: [diario]}
  - {text: pan, aliases: [pan, panes], level: A1, meaning: "un alimento hecho con harina", meaning_fr: "pain", period: General, theme: Economía, example: "El pan escaseó durante el sitio.", tags: [comida]}
  - {text: rey, aliases: [rey, reyes], level: A1, meaning: "un hombre que gobierna un reino", meaning_fr: "roi", period: Edad Media, theme: Política, example: "El rey firmó el tratado.", tags: [política]}
  - {text: reina, aliases: [reina, reinas], level: A1, meaning: "una mujer que gobierna un reino", meaning_fr: "reine", period: Edad Media, theme: Política, example: "La reina mandó construir el puente.", tags: [política]}
  - {text: guerrero, aliases: [guerrero, guerreros], level: A1, meaning: "una persona que lucha", meaning_fr: "guerrier", period: Edad Media, theme: Guerra, example: "El guerrero protegía la aldea.", tags: [guerra]}
  - {text: espada, aliases: [espada, espadas], level: A1, meaning: "un arma con hoja larga", meaning_fr: "épée", period: Edad Media, theme: Guerra, example: "La espada colgaba en la pared.", tags: [armas]}
  - {text: escudo, aliases: [escudo, escudos], level: A1, meaning: "un objeto para protegerse de un ataque", meaning_fr: "bouclier", period: Edad Media, theme: Guerra, example: "El caballero llevaba un escudo.", tags: [armas]}
  - {text: bandera, aliases: [bandera, banderas], level: A1, meaning: "una tela usada como símbolo", meaning_fr: "drapeau", period: General, theme: Política, example: "La bandera se izó sobre la ciudad.", tags: [símbolos]}
  - {text: camino, aliases: [camino, caminos], level: A1, meaning: "una ruta entre dos lugares", meaning_fr: "route", period: Antigüedad, theme: Sociedad, example: "El camino cruzaba las montañas.", tags: [lugares]}
  - {text: campo, aliases: [campo, campos], level: A1, meaning: "un terreno abierto", meaning_fr: "champ", period: General, theme: Economía, example: "Los campesinos trabajaban en el campo.", tags: [naturaleza]}
  - {text: mercado, aliases: [mercado, mercados], level: A1, meaning: "un lugar donde se compra y vende", meaning_fr: "marché", period: General, theme: Economía, example: "El mercado abría al amanecer.", tags: [economía]}
  - {text: nombre, aliases: [nombre, nombres], level: A1, meaning: "la palabra que identifica a alguien o algo", meaning_fr: "nom", period: General, theme: Sociedad, example: "La ciudad cambió de nombre.", tags: [lenguaje]}
  - {text: año, aliases: [año, años], level: A1, meaning: "un período de doce meses", meaning_fr: "année", period: General, theme: Sociedad, example: "El tratado duró solo un año.", tags: [tiempo]}
  - {text: niño, aliases: [niño, niños], level: A1, meaning: "un ser humano joven", meaning_fr: "enfant", period: General, theme: Sociedad, example: "El niño escuchaba la historia.", tags: [personas]}
  - {text: aldea, aliases: [aldea, aldeas], level: A1, meaning: "una comunidad pequeña en el campo", meaning_fr: "village", period: Edad Media, theme: Sociedad, example: "La aldea creció junto a la abadía.", tags: [lugares]}
  - {text: oro, aliases: [oro, áureo], level: A1, meaning: "un metal precioso amarillo", meaning_fr: "or", period: Antigüedad, theme: Economía, example: "Encontraron oro en el río.", tags: [economía]}
  - {text: libro, aliases: [libro, libros], level: A1, meaning: "una obra escrita con páginas", meaning_fr: "livre", period: General, theme: Cultura, example: "El libro describe la Roma antigua.", tags: [cultura]}
  - {text: barco, aliases: [barco, barcos], level: A1, meaning: "un vehículo que navega por el agua", meaning_fr: "bateau", period: Edad Moderna, theme: Guerra, example: "El barco zarpó al amanecer.", tags: [viajes]}
  - {text: torre, aliases: [torre, torres], level: A1, meaning: "una construcción alta", meaning_fr: "tour", period: Edad Media, theme: Cultura, example: "La torre dominaba el paisaje.", tags: [arquitectura]}
  - {text: campesino, aliases: [campesino, campesinos], level: A2, meaning: "una persona que trabaja la tierra", meaning_fr: "paysan", period: Edad Media, theme: Economía, example: "El campesino pagaba impuestos por la cosecha.", tags: [trabajo]}
  - {text: soldado, aliases: [soldado, soldados], level: A2, meaning: "una persona que lucha en un ejército", meaning_fr: "soldat", period: General, theme: Guerra, example: "El soldado volvió de la campaña.", tags: [guerra]}
  - {text: capitán, aliases: [capitán, capitanes], level: A2, meaning: "un oficial que dirige a un grupo", meaning_fr: "capitaine", period: Edad Moderna, theme: Guerra, example: "El capitán dirigía el barco.", tags: [guerra]}
  - {text: puerto, aliases: [puerto, puertos], level: A2, meaning: "un lugar seguro para los barcos", meaning_fr: "port", period: General, theme: Economía, example: "Los barcos esperaban en el puerto.", tags: [comercio]}
  - {text: comercio, aliases: [comercio, comercios], level: A2, meaning: "la compra y venta de productos", meaning_fr: "commerce", period: General, theme: Economía, example: "El comercio unía dos continentes.", tags: [economía]}
  - {text: ley, aliases: [ley, leyes], level: A2, meaning: "una norma creada por un gobierno", meaning_fr: "loi", period: General, theme: Política, example: "La nueva ley protegía a los trabajadores.", tags: [política]}
  - {text: concejo, aliases: [concejo, concejos], level: A2, meaning: "un grupo que se reúne para decidir", meaning_fr: "conseil", period: Edad Media, theme: Política, example: "El concejo aconsejaba al rey.", tags: [política]}
  - {text: abadía, aliases: [abadía, abadías], level: A2, meaning: "un edificio donde viven monjes o monjas", meaning_fr: "abbaye", period: Edad Media, theme: Religión, example: "La abadía se reconstruyó en piedra.", tags: [religión]}
  - {text: monasterio, aliases: [monasterio, monasterios], level: A2, meaning: "un lugar donde viven y trabajan los monjes", meaning_fr: "monastère", period: Edad Media, theme: Religión, example: "Los monjes copiaban libros en el monasterio.", tags: [religión]}
  - {text: cronista, aliases: [cronista, cronistas], level: A2, meaning: "una persona que escribe sobre el pasado", meaning_fr: "chroniqueur", period: Edad Media, theme: Cultura, example: "El cronista registró la batalla.", tags: [cultura]}
  - {text: mapa, aliases: [mapa, mapas], level: A2, meaning: "un dibujo de una zona de tierra", meaning_fr: "carte", period: Edad Moderna, theme: Ciencia, example: "El mapa mostraba las nuevas colonias.", tags: [ciencia]}
  - {text: costa, aliases: [costa, costas], level: A2, meaning: "la tierra junto al mar", meaning_fr: "côte", period: General, theme: Sociedad, example: "El ejército avanzó por la costa.", tags: [naturaleza]}
  - {text: artesanía, aliases: [artesanía, artesanías], level: A2, meaning: "una actividad manual especializada", meaning_fr: "artisanat", period: Edad Media, theme: Economía, example: "La artesanía floreció en el pueblo.", tags: [trabajo]}
  - {text: costumbre, aliases: [costumbre, costumbres], level: A2, meaning: "una tradición seguida por un grupo", meaning_fr: "coutume", period: General, theme: Sociedad, example: "La costumbre sobrevivió siglos.", tags: [cultura]}
  - {text: impuesto, aliases: [impuesto, impuestos], level: A2, meaning: "una cantidad que se paga al Estado", meaning_fr: "impôt", period: General, theme: Economía, example: "El impuesto financió las carreteras.", tags: [economía]}
  - {text: alcalde, aliases: [alcalde, alcaldes], level: A2, meaning: "la autoridad principal de un municipio", meaning_fr: "maire", period: Edad Media, theme: Política, example: "El alcalde abrió el mercado.", tags: [política]}
  - {text: cosecha, aliases: [cosecha, cosechas], level: A2, meaning: "la recogida de cultivos", meaning_fr: "récolte", period: General, theme: Economía, example: "La cosecha fue abundante.", tags: [economía]}
  - {text: viaje, aliases: [viaje, viajes], level: A2, meaning: "el acto de ir a otro lugar", meaning_fr: "voyage", period: Edad Moderna, theme: Sociedad, example: "El viaje duró varias semanas.", tags: [viajes]}
  - {text: ciudad, aliases: [ciudad, ciudades], level: A2, meaning: "un lugar grande con muchas personas", meaning_fr: "ville", period: General, theme: Sociedad, example: "La ciudad amurallada resistió el sitio.", tags: [lugares]}
  - {text: templo, aliases: [templo, templos], level: A2, meaning: "un edificio para el culto religioso", meaning_fr: "temple", period: Antigüedad, theme: Religión, example: "El templo estaba dedicado a Apolo.", tags: [religión]}
  - {text: conquista, aliases: [conquista, conquistas], level: B1, meaning: "el acto de tomar un territorio por la fuerza", meaning_fr: "conquête", period: Antigüedad, theme: Guerra, example: "La conquista cambió la región.", tags: [guerra]}
  - {text: colono, aliases: [colono, colonos], level: B1, meaning: "una persona que se establece en una tierra nueva", meaning_fr: "colon", period: Siglo XIX, theme: Imperio, example: "El colono construyó una casa pequeña.", tags: [imperio]}
  - {text: mercader, aliases: [mercader, mercaderes], level: B1, meaning: "una persona que compra y vende productos", meaning_fr: "marchand", period: General, theme: Economía, example: "El mercader viajaba con seda.", tags: [economía]}
  - {text: medieval, aliases: [medieval, mediaeval], level: B1, meaning: "relativo a la Edad Media", meaning_fr: "médiéval", period: Edad Media, theme: Cultura, example: "El museo guarda armaduras medievales.", tags: [tiempo]}
  - {text: sitio, aliases: [sitio, sitios], level: B1, meaning: "un bloqueo militar de una ciudad", meaning_fr: "siège", period: Edad Media, theme: Guerra, example: "El sitio duró tres meses.", tags: [guerra]}
  - {text: tregua, aliases: [tregua, treguas], level: B1, meaning: "un acuerdo para dejar de combatir", meaning_fr: "trêve", period: General, theme: Guerra, example: "Firmaron una tregua en invierno.", tags: [guerra]}
  - {text: coronación, aliases: [coronación, coronaciones], level: B1, meaning: "la ceremonia de coronar a un soberano", meaning_fr: "couronnement", period: Edad Media, theme: Política, example: "La coronación tuvo lugar en la catedral.", tags: [política]}
  - {text: parlamento, aliases: [parlamento, parlamentos], level: B1, meaning: "un grupo que elabora las leyes de un país", meaning_fr: "parlement", period: Edad Moderna, theme: Política, example: "El parlamento debatió el impuesto.", tags: [política]}
  - {text: impresor, aliases: [impresor, impresores], level: B1, meaning: "una persona que imprime libros", meaning_fr: "imprimeur", period: Edad Moderna, theme: Cultura, example: "El impresor publicó un folleto.", tags: [cultura]}
  - {text: peregrinación, aliases: [peregrinación, peregrinaciones], level: B1, meaning: "un viaje a un lugar sagrado", meaning_fr: "pèlerinage", period: Edad Media, theme: Religión, example: "La peregrinación duró semanas.", tags: [religión]}
  - {text: migración, aliases: [migración, migraciones], level: B1, meaning: "el movimiento de personas a otro lugar", meaning_fr: "migration", period: General, theme: Sociedad, example: "La migración cambió las ciudades.", tags: [sociedad]}
  - {text: frontera, aliases: [frontera, fronteras], level: B1, meaning: "el límite entre dos territorios", meaning_fr: "frontière", period: Siglo XIX, theme: Imperio, example: "La frontera avanzaba cada año.", tags: [imperio]}
  - {text: reforma, aliases: [reforma, reformas], level: B1, meaning: "un cambio para mejorar una institución", meaning_fr: "réforme", period: Edad Moderna, theme: Religión, example: "La reforma dividió a la cristiandad.", tags: [religión]}
  - {text: batalla, aliases: [batalla, batallas], level: B1, meaning: "un combate entre dos ejércitos", meaning_fr: "bataille", period: General, theme: Guerra, example: "La batalla empezó al amanecer.", tags: [guerra]}
  - {text: tratado, aliases: [tratado, tratados], level: B1, meaning: "un acuerdo formal entre Estados", meaning_fr: "traité", period: General, theme: Política, example: "El tratado puso fin a la guerra.", tags: [política]}
  - {text: dinastía, aliases: [dinastía, dinastías], level: B1, meaning: "una sucesión de gobernantes de una familia", meaning_fr: "dynastie", period: Edad Media, theme: Política, example: "La dinastía duró tres siglos.", tags: [política]}
  - {text: emperador, aliases: [emperador, emperadores], level: B1, meaning: "un gobernante de un imperio", meaning_fr: "empereur", period: Antigüedad, theme: Política, example: "El emperador promulgó una ley.", tags: [política]}
  - {text: revuelta, aliases: [revuelta, revueltas], level: B1, meaning: "una rebelión contra la autoridad", meaning_fr: "révolte", period: General, theme: Revolución, example: "La revuelta se extendió por el campo.", tags: [revolución]}
  - {text: imperio, aliases: [imperio, imperios], level: B1, meaning: "un conjunto de territorios gobernados por un emperador", meaning_fr: "empire", period: Antigüedad, theme: Imperio, example: "El imperio abarcaba tres continentes.", tags: [imperio]}
  - {text: colonia, aliases: [colonia, colonias], level: B1, meaning: "un territorio controlado por otro país", meaning_fr: "colonie", period: Siglo XIX, theme: Imperio, example: "La colonia exportaba azúcar.", tags: [imperio]}
  - {text: civilización, aliases: [civilización, civilizaciones], level: B2, meaning: "una sociedad humana avanzada", meaning_fr: "civilisation", period: Antigüedad, theme: Cultura, example: "La civilización dejó grandes monumentos.", tags: [cultura]}
  - {text: excavación, aliases: [excavación, excavaciones], level: B2, meaning: "la acción de desenterrar restos antiguos", meaning_fr: "fouille", period: Antigüedad, theme: Ciencia, example: "La excavación reveló un templo.", tags: [ciencia]}
  - {text: artefacto, aliases: [artefacto, artefactos], level: B2, meaning: "un objeto fabricado por una persona", meaning_fr: "artefact", period: Antigüedad, theme: Cultura, example: "El artefacto data del siglo III a. C.", tags: [cultura]}
  - {text: arancel, aliases: [arancel, aranceles], level: B2, meaning: "un impuesto sobre bienes importados", meaning_fr: "tarif", period: Siglo XIX, theme: Economía, example: "El arancel protegía a los productores.", tags: [economía]}
  - {text: insurrección, aliases: [insurrección, insurrecciones], level: B2, meaning: "un levantamiento contra la autoridad", meaning_fr: "insurrection", period: General, theme: Revolución, example: "La insurrección estalló en la capital.", tags: [revolución]}
  - {text: monarquía, aliases: [monarquía, monarquías], level: B2, meaning: "un sistema gobernado por un rey o una reina", meaning_fr: "monarchie", period: Edad Moderna, theme: Política, example: "La monarquía perdió poder en 1789.", tags: [política]}
  - {text: levantamiento, aliases: [levantamiento, levantamientos], level: B2, meaning: "una revuelta repentina de un grupo", meaning_fr: "soulèvement", period: General, theme: Revolución, example: "El levantamiento llegó a otros pueblos.", tags: [revolución]}
  - {text: ilustración, aliases: [ilustración, ilustraciones], level: B2, meaning: "un movimiento del siglo XVIII centrado en la razón", meaning_fr: "Lumières", period: Edad Moderna, theme: Cultura, example: "La ilustración impulsó el debate público.", tags: [cultura]}
  - {text: censo, aliases: [censo, censos], level: B2, meaning: "un recuento oficial de la población", meaning_fr: "recensement", period: General, theme: Sociedad, example: "El censo registró cada hogar.", tags: [sociedad]}
  - {text: canal, aliases: [canal, canales], level: B2, meaning: "una vía de agua artificial", meaning_fr: "canal", period: Siglo XIX, theme: Economía, example: "El canal unía dos ríos.", tags: [economía]}
  - {text: fábrica, aliases: [fábrica, fábricas], level: B2, meaning: "un edificio donde se producen bienes", meaning_fr: "usine", period: Siglo XIX, theme: Economía, example: "La fábrica daba trabajo a cientos de personas.", tags: [trabajo]}
  - {text: ferrocarril, aliases: [ferrocarril, ferrocarriles], level: B2, meaning: "una vía para trenes", meaning_fr: "chemin de fer", period: Siglo XIX, theme: Economía, example: "El ferrocarril conectó la costa.", tags: [transporte]}
  - {text: secularismo, aliases: [secularismo, laicismo], level: B2, meaning: "la separación entre religión y vida pública", meaning_fr: "laïcisme", period: Siglo XIX, theme: Religión, example: "El secularismo transformó la escuela.", tags: [religión]}
  - {text: industrialización, aliases: [industrialización, industrializacion], level: B2, meaning: "el paso a una economía basada en la industria", meaning_fr: "industrialisation", period: Siglo XIX, theme: Economía, example: "La industrialización cambió la sociedad.", tags: [economía]}
  - {text: textil, aliases: [textil, textiles], level: B2, meaning: "relativo a los tejidos", meaning_fr: "textile", period: Siglo XIX, theme: Economía, example: "La industria textil empleaba a muchas mujeres.", tags: [trabajo]}
  - {text: soberanía, aliases: [soberanía, soberanias], level: B2, meaning: "el poder supremo de un Estado", meaning_fr: "souveraineté", period: Edad Moderna, theme: Política, example: "El tratado reconoció la soberanía.", tags: [política]}
  - {text: república, aliases: [república, repúblicas], level: B2, meaning: "un sistema político sin monarca", meaning_fr: "république", period: Siglo XIX, theme: Política, example: "Proclamaron la república en 1871.", tags: [política]}
  - {text: sufragio, aliases: [sufragio, sufragios], level: B2, meaning: "el derecho a votar", meaning_fr: "suffrage", period: Siglo XIX, theme: Política, example: "El sufragio universal fue una conquista.", tags: [política]}
  - {text: economía, aliases: [economía, economias], level: B2, meaning: "la producción y distribución de bienes", meaning_fr: "économie", period: General, theme: Economía, example: "La economía dependía del comercio.", tags: [economía]}
  - {text: sociedad, aliases: [sociedad, sociedades], level: B2, meaning: "un grupo de personas que conviven", meaning_fr: "société", period: General, theme: Sociedad, example: "La sociedad industrial cambió deprisa.", tags: [sociedad]}
  - {text: arqueología, aliases: [arqueología, arqueologia], level: C1, meaning: "el estudio de sociedades pasadas mediante restos materiales", meaning_fr: "archéologie", period: Antigüedad, theme: Ciencia, example: "La arqueología reveló la ciudad enterrada.", tags: [ciencia]}
  - {text: cronología, aliases: [cronología, cronologias], level: C1, meaning: "la ordenación de hechos en el tiempo", meaning_fr: "chronologie", period: General, theme: Ciencia, example: "La cronología se apoyaba en monedas.", tags: [tiempo]}
  - {text: anales, aliases: [anales], level: C1, meaning: "registros de sucesos año por año", meaning_fr: "annales", period: Edad Media, theme: Cultura, example: "Los anales citan una epidemia.", tags: [cultura]}
  - {text: suzeranía, aliases: [suzeranía, suzerania], level: C1, meaning: "la autoridad de un Estado sobre otro", meaning_fr: "suzeraineté", period: Edad Media, theme: Política, example: "El rey ejercía la suzeranía del ducado.", tags: [política]}
  - {text: vasallo, aliases: [vasallo, vasallos], level: C1, meaning: "un tenedor de tierras que debía servicio a un señor", meaning_fr: "vassal", period: Edad Media, theme: Política, example: "Cada vasallo acudía a la llamada real.", tags: [política]}
  - {text: mercantilismo, aliases: [mercantilismo], level: C1, meaning: "una doctrina económica centrada en el comercio y la riqueza", meaning_fr: "mercantilisme", period: Edad Moderna, theme: Economía, example: "El mercantilismo guiaba la política colonial.", tags: [economía]}
  - {text: absolutismo, aliases: [absolutismo, absolutista], level: C1, meaning: "un sistema donde el monarca tiene poder sin límites", meaning_fr: "absolutisme", period: Edad Moderna, theme: Política, example: "El absolutismo se consolidó en el siglo XVII.", tags: [política]}
  - {text: filósofo, aliases: [filósofo, filósofos], level: C1, meaning: "un pensador que analiza ideas y valores", meaning_fr: "philosophe", period: Edad Moderna, theme: Cultura, example: "El filósofo defendía la tolerancia.", tags: [cultura]}
  - {text: igualdad, aliases: [igualdad], level: C1, meaning: "el principio de tratar a todos del mismo modo", meaning_fr: "égalité", period: Siglo XIX, theme: Sociedad, example: "La igualdad ante la ley fue una meta.", tags: [sociedad]}
  - {text: urbanización, aliases: [urbanización, urbanizacion], level: C1, meaning: "el crecimiento de las ciudades", meaning_fr: "urbanisation", period: Siglo XIX, theme: Sociedad, example: "La urbanización transformó el campo.", tags: [sociedad]}
  - {text: sufragista, aliases: [sufragista, sufragistas], level: C1, meaning: "una persona que luchaba por el sufragio femenino", meaning_fr: "suffragette", period: Siglo XIX, theme: Sociedad, example: "La sufragista fue detenida en la manifestación.", tags: [sociedad]}
  - {text: armisticio, aliases: [armisticio, armisticios], level: C1, meaning: "un acuerdo para suspender temporalmente la lucha", meaning_fr: "armistice", period: Primera Guerra Mundial, theme: Guerra, example: "El armisticio se firmó en noviembre de 1918.", tags: [guerra]}
  - {text: trinchera, aliases: [trinchera, trincheras], level: C1, meaning: "una zanja larga usada como defensa", meaning_fr: "tranchée", period: Primera Guerra Mundial, theme: Guerra, example: "Los soldados ocupaban las trincheras.", tags: [guerra]}
  - {text: mandato, aliases: [mandato, mandatos], level: C1, meaning: "la autoridad para administrar un territorio concedida por un organismo internacional", meaning_fr: "mandat", period: Entreguerras, theme: Política, example: "El mandato duró hasta 1946.", tags: [política]}
  - {text: historiografía, aliases: [historiografía, historiografia], level: C1, meaning: "el estudio de cómo se ha escrito la historia", meaning_fr: "historiographie", period: Contemporáneo, theme: Cultura, example: "La historiografía revisó el episodio.", tags: [cultura]}
  - {text: secularización, aliases: [secularización, secularizacion], level: C1, meaning: "el proceso de separar una institución de la religión", meaning_fr: "laïcisation", period: Siglo XIX, theme: Religión, example: "La secularización de la escuela fue lenta.", tags: [religión]}
  - {text: diplomacia, aliases: [diplomacia], level: C1, meaning: "la gestión de relaciones entre Estados", meaning_fr: "diplomatie", period: General, theme: Política, example: "La diplomacia evitó un nuevo conflicto.", tags: [política]}
  - {text: nacionalismo, aliases: [nacionalismo], level: C1, meaning: "la defensa de la identidad de una nación", meaning_fr: "nationalisme", period: Siglo XIX, theme: Política, example: "El nacionalismo se extendió por Europa.", tags: [política]}
  - {text: modernización, aliases: [modernización, modernizacion], level: C1, meaning: "el proceso de adaptar algo a la época moderna", meaning_fr: "modernisation", period: Siglo XIX, theme: Sociedad, example: "La modernización del ejército fue costosa.", tags: [sociedad]}
  - {text: neutralidad, aliases: [neutralidad], level: C1, meaning: "la postura de no participar en un conflicto", meaning_fr: "neutralité", period: Primera Guerra Mundial, theme: Política, example: "El país declaró su neutralidad.", tags: [política]}
  - {text: anacronismo, aliases: [anacronismo, anacronismos], level: C2, meaning: "algo que pertenece a una época distinta de su contexto", meaning_fr: "anachronisme", period: General, theme: Cultura, example: "El cuadro contenía un anacronismo.", tags: [cultura]}
  - {text: archivístico, aliases: [archivístico, archivistica], level: C2, meaning: "relativo a los documentos conservados en un archivo", meaning_fr: "archivistique", period: Contemporáneo, theme: Cultura, example: "El fondo archivístico se restauró.", tags: [cultura]}
  - {text: cartografía, aliases: [cartografía, cartografia], level: C2, meaning: "el arte y la ciencia de elaborar mapas", meaning_fr: "cartographie", period: Edad Moderna, theme: Ciencia, example: "La cartografía portuguesa avanzó rápido.", tags: [ciencia]}
  - {text: causalidad, aliases: [causalidad], level: C2, meaning: "la relación entre una causa y su efecto", meaning_fr: "causalité", period: General, theme: Ciencia, example: "Analizaron la causalidad de la crisis.", tags: [ciencia]}
  - {text: confederación, aliases: [confederación, confederacion], level: C2, meaning: "una unión flexible de Estados o grupos", meaning_fr: "confédération", period: Siglo XIX, theme: Política, example: "La confederación se deshizo tras la guerra.", tags: [política]}
  - {text: contextualización, aliases: [contextualización, contextualizacion], level: C2, meaning: "la colocación de una fuente en su contexto histórico", meaning_fr: "contextualisation", period: Contemporáneo, theme: Cultura, example: "La contextualización cambió la lectura.", tags: [cultura]}
  - {text: determinismo, aliases: [determinismo], level: C2, meaning: "la creencia de que los hechos están fijados por causas anteriores", meaning_fr: "déterminisme", period: Siglo XIX, theme: Ciencia, example: "El determinismo económico dominaba el análisis.", tags: [ciencia]}
  - {text: discontinuidad, aliases: [discontinuidad], level: C2, meaning: "una ruptura en la continuidad de un proceso", meaning_fr: "discontinuité", period: Contemporáneo, theme: Cultura, example: "La obra subrayó la discontinuidad.", tags: [cultura]}
