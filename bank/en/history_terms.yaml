terms:
  - {text: ancient, aliases: [ancient, antiquity], level: A1, meaning: "from a very long time ago", meaning_fr: "ancien", period: Antiquity, theme: Culture, example: "We visited an ancient temple.", tags: [time]}
  - {text: city, aliases: [city, town], level: A1, meaning: "a large place where people live and work", meaning_fr: "ville", period: General, theme: Society, example: "Rome is an ancient city.", tags: [places]}
  - {text: king, aliases: [king, monarch], level: A1, meaning: "a man who rules a kingdom", meaning_fr: "roi", period: Middle Ages, theme: Politics, example: "The king lived in a castle.", tags: [people]}
  - {text: war, aliases: [war, wars], level: A1, meaning: "fighting between countries or groups", meaning_fr: "guerre", period: General, theme: War, example: "The war ended many years ago.", tags: [conflict]}
  - {text: story, aliases: [story, tales], level: A1, meaning: "an account of past events", meaning_fr: "histoire, récit", period: General, theme: Culture, example: "She told us a story about the past.", tags: [culture]}
  - {text: temple, aliases: [temple, shrine], level: A1, meaning: "a building used for religious worship", meaning_fr: "temple", period: Antiquity, theme: Religion, example: "The temple is very old.", tags: [religion]}
  - {text: castle, aliases: [castle, fortress], level: A2, meaning: "a strong building from the Middle Ages", meaning_fr: "château", period: Middle Ages, theme: War, example: "The castle stands on a hill.", tags: [places]}
  - {text: empire, aliases: [empire, imperial], level: A2, meaning: "a group of lands ruled by one emperor or government", meaning_fr: "empire", period: General, theme: Empire, example: "The empire covered three continents.", tags: [politics]}
  - {text: revolution, aliases: [revolution, revolt], level: A2, meaning: "a major change in government or society", meaning_fr: "révolution", period: General, theme: Revolution, example: "The revolution changed the country.", tags: [politics]}
  - {text: treaty, aliases: [treaty, agreement], level: A2, meaning: "a formal agreement between countries", meaning_fr: "traité", period: General, theme: War, example: "They signed a treaty after the war.", tags: [diplomacy]}
  - {text: century, aliases: [century, centuries], level: A2, meaning: "a period of one hundred years", meaning_fr: "siècle", period: General, theme: Society, example: "This bridge is from the nineteenth century.", tags: [time]}
  - {text: museum, aliases: [museum, gallery], level: A2, meaning: "a place where historical objects are shown", meaning_fr: "musée", period: Contemporary, theme: Culture, example: "The museum opens at ten.", tags: [places]}
  - {text: dynasty, aliases: [dynasty, royal house], level: B1, meaning: "a family of rulers from the same line", meaning_fr: "dynastie", period: Middle Ages, theme: Politics, example: "The dynasty ruled for two centuries.", tags: [politics]}
  - {text: invasion, aliases: [invasion, attack], level: B1, meaning: "an attack by an army entering another land", meaning_fr: "invasion", period: General, theme: War, example: "The invasion began in spring.", tags: [conflict]}
  - {text: alliance, aliases: [alliance, coalition], level: B1, meaning: "an agreement to work or fight together", meaning_fr: "alliance", period: World War I, theme: Politics, example: "The two countries formed an alliance.", tags: [diplomacy]}
  - {text: rebellion, aliases: [rebellion, uprising], level: B1, meaning: "a fight against a ruler or government", meaning_fr: "rébellion", period: General, theme: Revolution, example: "The rebellion lasted six months.", tags: [conflict]}
  - {text: colony, aliases: [colony, settlement], level: B1, meaning: "a land controlled by another country", meaning_fr: "colonie", period: 19th century, theme: Empire, example: "The colony became independent in 1960.", tags: [politics]}
  - {text: reform, aliases: [reform, change], level: B1, meaning: "an improvement to a law or system", meaning_fr: "réforme", period: Early modern, theme: Politics, example: "The reform changed education.", tags: [society]}
  - {text: renaissance, aliases: [renaissance, rebirth], level: B2, meaning: "a European cultural revival from the fourteenth to seventeenth century", meaning_fr: "renaissance", period: Early modern, theme: Culture, example: "The renaissance produced great art.", tags: [art]}
  - {text: reformation, aliases: [reformation], level: B2, meaning: "the sixteenth-century movement that changed the Christian church", meaning_fr: "réforme protestante", period: Early modern, theme: Religion, example: "The reformation divided Europe.", tags: [religion]}
  - {text: industrialization, aliases: [industrialization, industrialisation], level: B2, meaning: "the change from farming and crafts to factory production", meaning_fr: "industrialisation", period: 19th century, theme: Economy, example: "Industrialization transformed cities.", tags: [economy]}
  - {text: federation, aliases: [federation, federal state], level: B2, meaning: "a country made of several states with shared laws", meaning_fr: "fédération", period: 19th century, theme: Politics, example: "The federation was created in 1871.", tags: [government]}
  - {text: independence, aliases: [independence, freedom], level: B2, meaning: "the state of governing oneself", meaning_fr: "indépendance", period: 20th century, theme: Politics, example: "Independence came after a long struggle.", tags: [politics]}
  - {text: constitution, aliases: [constitution, charter], level: B2, meaning: "the main set of laws and principles of a state", meaning_fr: "constitution", period: 18th century, theme: Politics, example: "The constitution protects citizens' rights.", tags: [law]}
  - {text: absolutism, aliases: [absolutism, absolute monarchy], level: C1, meaning: "a system where a ruler has unlimited power", meaning_fr: "absolutisme", period: Early modern, theme: Politics, example: "Absolutism shaped the French state.", tags: [government]}
  - {text: colonization, aliases: [colonization, colonisation], level: C1, meaning: "the process of taking control of another land", meaning_fr: "colonisation", period: 19th century, theme: Empire, example: "Colonization changed trade routes.", tags: [empire]}
  - {text: suffrage, aliases: [suffrage, voting rights], level: C1, meaning: "the right to vote in elections", meaning_fr: "suffrage", period: 19th century, theme: Society, example: "Women's suffrage expanded democracy.", tags: [rights]}
  - {text: secularization, aliases: [secularization, secularisation], level: C1, meaning: "the process of reducing religious influence in public life", meaning_fr: "laïcisation", period: 19th century, theme: Religion, example: "Secularization changed schools.", tags: [religion]}
  - {text: nationalism, aliases: [nationalism, patriotic movement], level: C1, meaning: "loyalty to a nation and belief in its interests", meaning_fr: "nationalisme", period: 19th century, theme: Politics, example: "Nationalism grew across Europe.", tags: [politics]}
  - {text: diplomacy, aliases: [diplomacy, diplomatic relations], level: C1, meaning: "the management of relations between countries", meaning_fr: "diplomatie", period: Cold War, theme: Politics, example: "Diplomacy prevented another war.", tags: [relations]}
  - {text: hegemony, aliases: [hegemony, dominance], level: C2, meaning: "leadership or dominance by one state or group", meaning_fr: "hégémonie", period: Cold War, theme: Empire, example: "The empire maintained regional hegemony.", tags: [power]}
  - {text: historiography, aliases: [historiography, history writing], level: C2, meaning: "the study of how history is written and interpreted", meaning_fr: "historiographie", period: Contemporary, theme: Culture, example: "Historiography re-examined old sources.", tags: [academic]}
  - {text: geopolitics, aliases: [geopolitics, geopolitical], level: C2, meaning: "the study of how geography affects politics and power", meaning_fr: "géopolitique", period: Cold War, theme: Politics, example: "Geopolitics shaped the alliance.", tags: [academic]}
  - {text: sovereignty, aliases: [sovereignty, sovereign state], level: C2, meaning: "the authority of a state to govern itself", meaning_fr: "souveraineté", period: Early modern, theme: Politics, example: "The treaty recognised national sovereignty.", tags: [law]}
  - {text: totalitarianism, aliases: [totalitarianism, totalitarian], level: C2, meaning: "a system where the state controls almost all aspects of life", meaning_fr: "totalitarisme", period: World War II, theme: Politics, example: "Totalitarianism emerged in the 1930s.", tags: [government]}
  - {text: decolonization, aliases: [decolonization, decolonisation], level: C2, meaning: "the process by which colonies become independent", meaning_fr: "décolonisation", period: Cold War, theme: Empire, example: "Decolonization reshaped the map.", tags: [politics]}
