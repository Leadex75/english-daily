# Source catalogue. Loaded into the `sources` table at startup (upsert by id).
# level_min/level_max may be "computed" for a full-range, pure readability level.
# license/attribution travel with each ingested item so static exports can label them.
sources:
  - id: bbc_6min_english
    name: BBC 6 Minute English
    feed_url: https://podcasts.files.bbci.co.uk/p02pc9tn.rss
    category: culture
    kind: audio
    level_min: B1
    level_max: B2
    enabled: true
    license: proprietary

  # Additional current BBC Learning English feeds (VOA's feeds are stale).
